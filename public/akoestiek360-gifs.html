<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"></head><body style="margin:0;background:#fcfcfc">
<!-- BEGIN SMARTBUILDER -->
<div class="a360g">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Oswald:wght@500&display=swap" />
<style>
  .a360g, .a360g *, .a360g *::before, .a360g *::after { box-sizing: border-box; }
  .a360g { container-type: inline-size; width: 100%; color: #0a0a0a; font-family: Merriweather, Georgia, serif; line-height: 1.45; }
  .a360g figure, .a360g figcaption, .a360g p { margin: 0; padding: 0; }
  .a360g img { display: block; width: 100%; height: auto; border: 0; }
  .a360g-panel {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.85rem;
    background: #fcfcfc;
    border: 1px solid #cfe3e6;
    padding: clamp(0.75rem, 2cqw, 1.1rem);
  }
  .a360g figure { background: #ffffff; border: 1px solid #d3e6e8; }
  .a360g figcaption {
    padding: 0.6rem 0.8rem 0.75rem;
    color: #003060 !important;
    font-family: Oswald, "Arial Narrow", sans-serif !important;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .a360g figcaption span {
    display: block;
    margin-top: 0.18rem;
    color: #3e5568 !important;
    font-family: Merriweather, Georgia, serif !important;
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }
  @container (max-width: 640px) {
    .a360g-panel { grid-template-columns: 1fr; }
  }
</style>
<section class="a360g-panel" aria-label="Meten, rapport en analyseren">
    <figure><img src="/gifs/akoestiek360-meten.gif" alt="Akoestiek360 geluidsmeter voor een nagalmmeting" width="560" height="560" /><figcaption>Meten<span>Nagalm en geluid op locatie</span></figcaption></figure>
    <figure><img src="/gifs/akoestiek360-rapport.gif" alt="Akoestisch rapport met grafiek en advies" width="560" height="560" /><figcaption>Rapport<span>Meetresultaten en advies</span></figcaption></figure>
    <figure><img src="/gifs/akoestiek360-analyseren.gif" alt="Analyse van een akoestische meting" width="560" height="560" /><figcaption>Analyseren<span>Oorzaak van het probleem</span></figcaption></figure>
</section>
</div>
<!-- END SMARTBUILDER -->
</body></html>
